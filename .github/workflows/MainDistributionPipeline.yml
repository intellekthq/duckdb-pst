# Build each DuckDB revision separately; artifacts are not interchangeable.
name: Main Extension Distribution Pipeline
on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - 'vcpkg_ports/**'
      - 'CHANGELOG.md'
      - '.github/workflows/MainDistributionPipeline.yml'
      - 'duckdb'
      - 'extension-ci-tools'
      - '.gitmodules'
      - 'microsoft-pst-sdk'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - 'vcpkg_ports/**'
      - 'CHANGELOG.md'
      - '.github/workflows/MainDistributionPipeline.yml'
      - 'duckdb'
      - 'extension-ci-tools'
      - '.gitmodules'
      - 'microsoft-pst-sdk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-development-build:
    name: Pinned 2.0 development
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_distribution.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      # v2.0-cyanoptera, retrieved 2026-11-14; not DuckDB main (2.1).
      duckdb_commit: cb5673685153159d22bf1042ab444273c9ad268a
      # Identity of the staged runtime at this exact commit, not v2.0.0.
      duckdb_version: v2.0.1-alpha55482
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      extension_name: pst
      exclude_archs: windows_amd64_mingw
      artifact_postfix: '-development'
      reduced_ci_mode: disabled
      post_build_command: 'python3 scripts/ci_arm64_tests.py'
      test_config: '{"test_env_variables":{"LANG":"C","LC_ALL":"C"}}'

  community-stable-build:
    name: Community 2.0.0 upstream harness
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@c286b12cee2aa16b714e76d0b46e530fcdb6dc05
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: c286b12cee2aa16b714e76d0b46e530fcdb6dc05
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      extension_name: pst
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      artifact_postfix: '-community'
      reduced_ci_mode: disabled
      post_build_command: 'python3 scripts/ci_arm64_tests.py'
      test_config: '{"test_env_variables":{"LANG":"C","LC_ALL":"C"}}'

  # Retain existing source platforms and main-branch deployment artifacts.
  duckdb-stable-build:
    name: Build extension binaries
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_distribution.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      duckdb_version: v2.0.0
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      extension_name: pst
      exclude_archs: windows_amd64_mingw
      reduced_ci_mode: disabled
      post_build_command: 'python3 scripts/ci_arm64_tests.py'
      test_config: '{"test_env_variables":{"LANG":"C","LC_ALL":"C"}}'

  duckdb-stable-deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Deploy stable extension binaries
    needs: duckdb-stable-build
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_deploy.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      extension_name: pst
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      duckdb_version: v2.0.0
      exclude_archs: windows_amd64_mingw
      deploy_latest: ${{ github.ref == 'refs/heads/main' }}

  code-quality-check:
    name: Code Quality Check
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_code_quality.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      duckdb_version: v2.0.0
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      extension_name: pst
      format_checks: 'format'
