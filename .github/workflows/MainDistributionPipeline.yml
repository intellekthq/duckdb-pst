#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - '.github/workflows/MainDistributionPipeline.yml'
      - 'duckdb'
      - 'extension-ci-tools'
      - '.gitmodules'
      - 'microsoft-pst-sdk'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension_config.cmake'
      - 'vcpkg.json'
      - '.github/workflows/MainDistributionPipeline.yml'
      - 'duckdb'
      - 'extension-ci-tools'
      - '.gitmodules'
      - 'microsoft-pst-sdk'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_distribution.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      duckdb_version: v2.0.0
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      extension_name: pst
      exclude_archs: windows_amd64_mingw

  duckdb-stable-deploy:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
    name: Deploy stable extension binaries
    needs: duckdb-stable-build
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_deploy.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      extension_name: pst
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      duckdb_version: v2.0.0
      exclude_archs: windows_amd64_mingw
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  code-quality-check:
    name: Code Quality Check
    uses: intellekthq/duckdb-extension-ci-tools/.github/workflows/_extension_code_quality.yml@c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
    with:
      duckdb_version: v2.0.0
      ci_tools_version: c09374aa16e61d7fd6fbc13d8dc3ffc498d60914
      override_ci_tools_repository: intellekthq/duckdb-extension-ci-tools
      extension_name: pst
      format_checks: 'format'
